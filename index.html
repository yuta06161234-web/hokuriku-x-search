<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>北陸 X SEARCH</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f6fa;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

.header {
  background: #182131;
  color: white;
  text-align: center;
  padding: 25px 15px 20px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 7px 0 0;
  font-size: 12px;
  opacity: 0.8;
}

#jsStatus {
  display: inline-block;
  margin-top: 10px;
  padding: 5px 10px;
  background: rgba(255,255,255,0.15);
  border-radius: 20px;
  font-size: 11px;
}

.container {
  max-width: 680px;
  margin: auto;
  padding: 14px 12px 40px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 16px 13px;
  margin-bottom: 12px;
  box-shadow: 0 3px 14px rgba(0,0,0,0.05);
}

.title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 12px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.choice {
  position: relative;
}

.choice input {
  position: absolute;
  opacity: 0;
}

.choice label {
  min-height: 46px;
  border: 2px solid #e2e7ee;
  border-radius: 11px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 8px;
  font-size: 14px;
  font-weight: bold;
}

.choice input:checked + label {
  background: #172033;
  border-color: #172033;
  color: white;
}


/* カテゴリ */

.category {
  position: relative;
  margin-bottom: 8px;
}

.category input {
  position: absolute;
  opacity: 0;
}

.category label {
  display: flex;
  align-items: center;
  min-height: 50px;
  border: 2px solid #e1e6ed;
  border-radius: 11px;
  padding: 10px;
  font-size: 14px;
}

.category label:before {
  content: "＋";
  width: 27px;
  height: 27px;
  min-width: 27px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-right: 9px;
  border-radius: 50%;
  background: #edf1f5;
  font-weight: bold;
}

.category input:checked + label {
  background: #eef5ff;
  border-color: #3976e8;
  color: #174aa7;
  font-weight: bold;
}

.category input:checked + label:before {
  content: "✓";
  background: #3976e8;
  color: white;
}


/* 入力 */

select,
input[type="text"] {
  width: 100%;
  height: 48px;
  border: 2px solid #e1e6ed;
  border-radius: 11px;
  padding: 0 11px;
  background: white;
  font-size: 15px;
}

.label {
  display: block;
  margin: 12px 0 6px;
  font-size: 13px;
  font-weight: bold;
}

.note {
  margin-top: 8px;
  color: #6d7786;
  font-size: 11px;
  line-height: 1.6;
}


/* 検索文 */

#queryOutput {
  width: 100%;
  min-height: 150px;
  border: 2px solid #dfe5ed;
  border-radius: 11px;
  background: #f7f9fc;
  padding: 12px;
  font-size: 12px;
  line-height: 1.65;
  color: #303744;
  resize: vertical;
}


/* ボタン */

.button {
  width: 100%;
  min-height: 54px;
  margin-top: 9px;
  border: 0;
  border-radius: 13px;
  font-size: 16px;
  font-weight: bold;
}

.make {
  background: #172033;
  color: white;
}

.copy {
  background: #3267e3;
  color: white;
}

.open {
  background: #111;
  color: white;
}

.reset {
  min-height: 43px;
  background: white;
  border: 1px solid #d8dee7;
  color: #555;
  font-size: 13px;
}

#status {
  min-height: 20px;
  margin-top: 9px;
  text-align: center;
  color: #198341;
  font-size: 13px;
  font-weight: bold;
}

.steps {
  background: #fff8e6;
  border: 1px solid #f0daa1;
  border-radius: 11px;
  padding: 12px;
  font-size: 12px;
  line-height: 1.8;
}

.footer {
  text-align: center;
  color: #8b94a2;
  font-size: 10px;
  line-height: 1.6;
  padding: 5px 20px 25px;
}

</style>

</head>


<body>


<div class="header">

  <h1>北陸 X SEARCH</h1>

  <p>
    石川・富山・福井の公開投稿を検索
  </p>

  <div id="jsStatus">
    読み込み中…
  </div>

</div>


<div class="container">


<!-- 地域 -->

<div class="card">

  <div class="title">
    ① 地域
  </div>

  <div class="grid">


    <div class="choice">

      <input
        type="radio"
        name="area"
        value="ishikawa"
        id="ishikawa"
        checked
        onchange="makeQuery()"
      >

      <label for="ishikawa">
        石川・金沢
      </label>

    </div>


    <div class="choice">

      <input
        type="radio"
        name="area"
        value="toyama"
        id="toyama"
        onchange="makeQuery()"
      >

      <label for="toyama">
        富山
      </label>

    </div>


    <div class="choice">

      <input
        type="radio"
        name="area"
        value="fukui"
        id="fukui"
        onchange="makeQuery()"
      >

      <label for="fukui">
        福井
      </label>

    </div>


    <div class="choice">

      <input
        type="radio"
        name="area"
        value="hokuriku"
        id="hokuriku"
        onchange="makeQuery()"
      >

      <label for="hokuriku">
        北陸全部
      </label>

    </div>


  </div>

</div>


<!-- カテゴリ -->

<div class="card">

  <div class="title">
    ② 探したい公開投稿
  </div>


  <div class="category">

    <input
      type="checkbox"
      id="job"
      onchange="makeQuery()"
    >

    <label for="job">
      仕事・求人を探している
    </label>

  </div>


  <div class="category">

    <input
      type="checkbox"
      id="move"
      onchange="makeQuery()"
    >

    <label for="move">
      移籍・お店を変えたい
    </label>

  </div>


  <div class="category">

    <input
      type="checkbox"
      id="beginner"
      onchange="makeQuery()"
    >

    <label for="beginner">
      夜職・デリヘル未経験関連
    </label>

  </div>


  <div class="category">

    <input
      type="checkbox"
      id="experienced"
      onchange="makeQuery()"
    >

    <label for="experienced">
      夜職・デリヘル経験者関連
    </label>

  </div>


  <div class="category">

    <input
      type="checkbox"
      id="ura"
      onchange="makeQuery()"
    >

    <label for="ura">
      裏垢女子・裏垢
    </label>

  </div>


  <div class="note">
    複数選択できます。
  </div>

</div>


<!-- 期間 -->

<div class="card">

  <div class="title">
    ③ 投稿期間
  </div>

  <select
    id="period"
    onchange="makeQuery()"
  >

    <option value="1">
      直近24時間
    </option>

    <option value="3">
      直近3日
    </option>

    <option
      value="7"
      selected
    >
      直近7日
    </option>

    <option value="30">
      直近30日
    </option>

    <option value="0">
      指定なし
    </option>

  </select>

</div>


<!-- 除外 -->

<div class="card">

  <div class="title">
    ④ 業者・広告アカウント除外
  </div>


  <div class="grid">


    <div class="choice">

      <input
        type="radio"
        name="exclude"
        value="off"
        id="excludeOff"
        onchange="makeQuery()"
      >

      <label for="excludeOff">
        OFF
      </label>

    </div>


    <div class="choice">

      <input
        type="radio"
        name="exclude"
        value="normal"
        id="excludeNormal"
        checked
        onchange="makeQuery()"
      >

      <label for="excludeNormal">
        標準
      </label>

    </div>


    <div class="choice">

      <input
        type="radio"
        name="exclude"
        value="strong"
        id="excludeStrong"
        onchange="makeQuery()"
      >

      <label for="excludeStrong">
        強め
      </label>

    </div>


  </div>

</div>


<!-- 自由入力 -->

<div class="card">

  <div class="title">
    ⑤ 追加条件
  </div>


  <label class="label">
    追加検索ワード
  </label>

  <input
    type="text"
    id="customKeyword"
    placeholder="例：金沢駅"
    oninput="makeQuery()"
  >


  <label class="label">
    除外したいワード
  </label>

  <input
    type="text"
    id="customExclude"
    placeholder="例：投資 副業 メンズ"
    oninput="makeQuery()"
  >


</div>


<!-- 検索文 -->

<div class="card">

  <div class="title">
    ⑥ 検索文
  </div>


  <textarea
    id="queryOutput"
    readonly
  ></textarea>


  <button
    type="button"
    class="button make"
    onclick="makeQuery()"
  >
    検索文を作成
  </button>


  <button
    type="button"
    class="button copy"
    onclick="copyQuery()"
  >
    検索文をコピー
  </button>


  <div id="status">
  </div>

</div>


<!-- X -->

<div class="card">

  <div class="title">
    ⑦ Xで検索
  </div>


  <div class="steps">

    ① 条件を選択<br>

    ② 「検索文をコピー」を押す<br>

    ③ 「Xの検索画面を開く」を押す<br>

    ④ Xの検索欄を長押し<br>

    ⑤ 「ペースト」<br>

    ⑥ 検索

  </div>


  <button
    type="button"
    class="button open"
    onclick="openX()"
  >
    Xの検索画面を開く
  </button>


  <button
    type="button"
    class="button reset"
    onclick="resetAll()"
  >
    条件をリセット
  </button>

</div>


</div>


<div class="footer">

Xの公開検索を利用するための
検索補助ツールです。

</div>
