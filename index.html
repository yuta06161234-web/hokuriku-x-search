<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>北陸 X SEARCH</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  background: #f4f7fb;
  color: #222;
}

.header {
  background: linear-gradient(135deg, #111827, #26364f);
  color: #fff;
  padding: 26px 15px 22px;
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: 25px;
  letter-spacing: 1px;
}

.header p {
  margin: 7px 0 0;
  font-size: 12px;
  opacity: 0.8;
}

.container {
  max-width: 680px;
  margin: auto;
  padding: 14px 13px 50px;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 17px 14px;
  margin-bottom: 13px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.05);
}

.card-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 12px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.option {
  position: relative;
}

.option input {
  position: absolute;
  opacity: 0;
}

.option label {
  min-height: 47px;
  border: 2px solid #e2e7ee;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  padding: 8px;
}

.option input:checked + label {
  background: #111827;
  border-color: #111827;
  color: #fff;
}


/* 検索カテゴリ */

.category {
  position: relative;
  margin-bottom: 9px;
}

.category input {
  position: absolute;
  opacity: 0;
}

.category label {
  display: flex;
  align-items: center;
  min-height: 51px;
  padding: 10px 12px;
  border: 2px solid #e3e8ef;
  border-radius: 11px;
  font-size: 14px;
  line-height: 1.4;
}

.category label::before {
  content: "＋";
  min-width: 27px;
  height: 27px;
  border-radius: 50%;
  margin-right: 9px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #edf1f5;
  font-weight: bold;
}

.category input:checked + label {
  border-color: #2563eb;
  background: #edf5ff;
  color: #174daf;
  font-weight: bold;
}

.category input:checked + label::before {
  content: "✓";
  background: #2563eb;
  color: #fff;
}


/* 入力 */

select,
input[type="text"] {
  width: 100%;
  height: 48px;
  padding: 0 12px;
  border: 2px solid #e1e6ed;
  border-radius: 11px;
  background: #fff;
  font-size: 15px;
  outline: none;
}

select:focus,
input[type="text"]:focus {
  border-color: #2563eb;
}

.field-label {
  display: block;
  margin: 13px 0 7px;
  font-size: 13px;
  font-weight: bold;
}

.note {
  color: #687386;
  font-size: 11px;
  line-height: 1.6;
  margin-top: 9px;
}


/* 検索式 */

.preview {
  background: #f7f9fc;
  border-radius: 10px;
  padding: 11px;
  color: #4b5563;
  font-size: 11px;
  line-height: 1.6;
  word-break: break-all;
}


/* ボタン */

.buttons {
  position: sticky;
  bottom: 0;
  padding:
    8px
    0
    max(10px, env(safe-area-inset-bottom));

  background:
    linear-gradient(
      to top,
      #f4f7fb 75%,
      rgba(244,247,251,0)
    );
}

.search-btn {
  width: 100%;
  min-height: 57px;
  border-radius: 14px;
  margin-top: 8px;

  display: flex;
  justify-content: center;
  align-items: center;

  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
}

.latest-btn {
  background: #111827;
  color: #fff;
}

.user-btn {
  background: #1d9bf0;
  color: #fff;
}

.reset-btn {
  width: 100%;
  height: 45px;
  margin-top: 8px;

  background: #fff;
  border: 1px solid #dfe4eb;
  border-radius: 12px;

  font-size: 13px;
  color: #555;
}

.footer {
  text-align: center;
  color: #9099a8;
  font-size: 10px;
  line-height: 1.6;
  padding: 5px 20px 25px;
}

</style>
</head>


<body>


<div class="header">

  <h1>北陸 X SEARCH</h1>

  <p>
    石川・富山・福井の公開投稿を検索
  </p>

</div>


<div class="container">


<!-- 地域 -->

<div class="card">

  <div class="card-title">
    ① 地域を選択
  </div>

  <div class="grid">

    <div class="option">
      <input
        type="radio"
        name="area"
        id="ishikawa"
        value="ishikawa"
        checked
      >
      <label for="ishikawa">
        石川・金沢
      </label>
    </div>

    <div class="option">
      <input
        type="radio"
        name="area"
        id="toyama"
        value="toyama"
      >
      <label for="toyama">
        富山
      </label>
    </div>

    <div class="option">
      <input
        type="radio"
        name="area"
        id="fukui"
        value="fukui"
      >
      <label for="fukui">
        福井
      </label>
    </div>

    <div class="option">
      <input
        type="radio"
        name="area"
        id="hokuriku"
        value="hokuriku"
      >
      <label for="hokuriku">
        北陸全部
      </label>
    </div>

  </div>

</div>


<!-- 検索内容 -->

<div class="card">

  <div class="card-title">
    ② 探したい公開投稿
  </div>


  <div class="category">

    <input
      type="checkbox"
      id="job"
    >

    <label for="job">
      仕事・求人を探している
    </label>

  </div>


  <div class="category">

    <input
      type="checkbox"
      id="move"
    >

    <label for="move">
      移籍・お店を変えたい
    </label>

  </div>


  <div class="category">

    <input
      type="checkbox"
      id="beginner"
    >

    <label for="beginner">
      夜職・デリヘル未経験関連
    </label>

  </div>


  <div class="category">

    <input
      type="checkbox"
      id="experienced"
    >

    <label for="experienced">
      夜職・デリヘル経験者関連
    </label>

  </div>


  <div class="category">

    <input
      type="checkbox"
      id="ura"
    >

    <label for="ura">
      裏垢女子・裏垢の公開投稿
    </label>

  </div>


  <div class="note">
    複数選択できます。
  </div>

</div>


<!-- 期間 -->

<div class="card">

  <div class="card-title">
    ③ 投稿期間
  </div>

  <select id="period">

    <option value="1">
      直近24時間
    </option>

    <option value="3">
      直近3日
    </option>

    <option
      value="7"
      selected
    >
      直近7日
    </option>

    <option value="30">
      直近30日
    </option>

    <option value="0">
      期間指定なし
    </option>

  </select>

</div>


<!-- 業者除外 -->

<div class="card">

  <div class="card-title">
    ④ 業者・広告アカウント除外
  </div>


  <div class="grid">

    <div class="option">

      <input
        type="radio"
        name="exclude"
        id="excludeOff"
        value="off"
      >

      <label for="excludeOff">
        OFF
      </label>

    </div>


    <div class="option">

      <input
        type="radio"
        name="exclude"
        id="excludeNormal"
        value="normal"
        checked
      >

      <label for="excludeNormal">
        標準
      </label>

    </div>


    <div class="option">

      <input
        type="radio"
        name="exclude"
        id="excludeStrong"
        value="strong"
      >

      <label for="excludeStrong">
        強め
      </label>

    </div>

  </div>


  <div class="note">
    スカウト・求人業者・広告系によく使われる言葉を
    X検索から除外します。
  </div>

</div>


<!-- 自由入力 -->

<div class="card">

  <div class="card-title">
    ⑤ 追加条件
  </div>


  <label class="field-label">
    追加検索ワード
  </label>

  <input
    type="text"
    id="customKeyword"
    placeholder="例：金沢駅"
  >


  <label class="field-label">
    除外したいワード
  </label>

  <input
    type="text"
    id="customExclude"
    placeholder="例：投資 副業 メンズ"
  >


  <div class="note">
    除外ワードはスペースで区切って入力できます。
  </div>

</div>


<!-- プレビュー -->

<div class="card">

  <div class="card-title">
    現在の検索条件
  </div>

  <div
    class="preview"
    id="preview"
  >
  </div>

</div>


<!-- 検索 -->

<div class="buttons">

  <a
    id="latestLink"
    class="search-btn latest-btn"
    href="https://x.com/search"
  >
    Xで最新投稿を検索
  </a>


  <a
    id="userLink"
    class="search-btn user-btn"
    href="https://x.com/search"
  >
    Xでアカウントを検索
  </a>


  <button
    class="reset-btn"
    id="resetButton"
    type="button"
  >
    条件をリセット
  </button>

</div>


</div>


<div class="footer">

このツールは公開されているX検索を開くための
検索補助ツールです。

</div>


<script>


/* 地域 */

const areas = {

  ishikawa:
  '(金沢 OR 石川 OR 野々市 OR 白山 OR 小松 OR 加賀 OR 能美 OR 津幡)',

  toyama:

  '(福井 OR 坂井 OR 鯖江 OR 越前 OR 敦賀 OR 小浜 OR 大野 OR 勝山)',

/* 検索内容 */

const categories = {

  move:

  off:

  strong:
  '-スカウト -求人垢 -求人募集 -採用担当 -求人担当 -スタッフ募集 -公式 -全国対応 -副業 -投資 -案件 -LINE追加 -紹介可能 -稼げます'

/* 日付作成 */

function getDate(days) {

  if (days === 0) {
    return '';
  }

  const d = new Date();

  d.setDate(
    d.getDate() - days
  );

  const year =
    d.getFullYear();

  const month =
    String(
      d.getMonth() + 1
    ).padStart(2, '0');

  const day =
    String(
      d.getDate()
    ).padStart(2, '0');

  return (
    'since:' +
    year +
    '-' +
    month +
    '-' +
    day
  );

}

function buildQuery() {

      );

    }

  });
